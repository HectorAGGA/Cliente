
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>

    <style>
        #imagen {
            background-color: black;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
        }

        h1 {
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="imagen">
        <h1>Pulsa Alt + F12 para cambiar la imagen de fondo</h1>
    </div>

    <script>
        document.addEventListener("keydown", function(event) {

            if (event.altKey && event.key === "F12") {

                document.getElementById("imagen").style.backgroundImage =
                    "url('https://picsum.photos/1920/1080?random=" + Math.random() + "')";

            }

        });
    </script>

</body>
</html>
