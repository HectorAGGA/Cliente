<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>
<body>
    <h2>Array original (con duplicados)</h2>
    <ul id="listaOriginal"></ul>

    <h2>Número de apariciones</h2>
    <ul id="listaRecuento"></ul>

    <script>
        const mostrarEnLista = (array, idLista) => {
            const ul = document.getElementById(idLista);
            ul.innerHTML = "";

            array.forEach(palabra => {
                const li = document.createElement("li");
                li.textContent = palabra;
                ul.appendChild(li);
            });
        };

        const contarPalabras = array => {
            const mapa = new Map();
            array.forEach(palabra => {
                mapa.set(palabra, (mapa.get(palabra) || 0) + 1);
            });
            return mapa;
        };

        let palabra = prompt("dime una palabra");
        const lista = [];

        while (palabra != "" && palabra != null) {
            lista.push(palabra);
            palabra = prompt("dime otra palabra");
        }

        const recuento = contarPalabras(lista);

        mostrarEnLista(lista, "listaOriginal");
        mostrarEnLista(
            [...recuento].map(([palabra, veces]) => `${palabra}: ${veces}`),
            "listaRecuento"
        );
    </script>
</body>
</html>
