<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
</head>
<body>
    <h2>Multiplicar por 2</h2>
    <ul id="listaMultiplicar"></ul>

    <h2>Palabras a mayúsculas</h2>
    <ul id="listaMayusculas"></ul>

    <h2>Factorial</h2>
    <ul id="listaFactorial"></ul>

    <script>
        const mostrarEnLista = (array, idLista) => {
            const ul = document.getElementById(idLista);
            ul.innerHTML = "";

            array.forEach(elemento => {
                const li = document.createElement("li");
                li.textContent = elemento;
                ul.appendChild(li);
            });
        };

        // Aplica el callback a cada elemento y guarda el resultado en el mismo array
        const filtro = (array, callback) => {
            for (let i = 0; i < array.length; i++) {
                array[i] = callback(array[i]);
            }
        };

        // Callbacks
        const multiplicarPor2 = n => n * 2;

        const aMayusculas = palabra => palabra.toUpperCase();

        const factorial = n => {
            let resultado = 1;
            for (let i = 2; i <= n; i++) {
                resultado *= i;
            }
            return resultado;
        };

        // Caso 1: multiplicar por 2
        const numeros = [1, 2, 3, 4];
        filtro(numeros, multiplicarPor2);
        mostrarEnLista(numeros, "listaMultiplicar");

        // Caso 2: palabras a mayúsculas
        const palabras = ["casa", "perro", "gato", "árbol"];
        filtro(palabras, aMayusculas);
        mostrarEnLista(palabras, "listaMayusculas");

        // Caso 3: factorial de cada número
        const paraFactorial = [1, 2, 3, 4, 5, 6];
        filtro(paraFactorial, factorial);
        mostrarEnLista(paraFactorial, "listaFactorial");
    </script>
</body>
</html>
